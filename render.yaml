# Render blueprint for Vorth.
#
# One web service: the API also serves the static frontend, so there is no second
# service to keep in sync. The database is external (Neon) and supplied by hand as
# DATABASE_URL; this blueprint does not provision one.
#
# Required before the site is publicly usable - all four are flagged at boot by
# src/config/preflight.js, and VORTH_STRICT_CONFIG=1 turns the first three into a
# refusal to start:
#
#   DATABASE_URL          the Neon connection string. Set by hand; see below.
#   CLIENT_ORIGINS        comma-separated allowed origins. With one service
#                         serving both, the site's own origin is enough. Listing a
#                         foreign origin also relaxes the refresh cookie to
#                         SameSite=None, which weakens CSRF protection - only do it
#                         if a separate frontend host genuinely exists.
#   PUBLIC_URL            the site origin. Without it every emailed reset and
#                         verification link is relative and unusable, and the
#                         server cannot tell which configured origin is itself, so
#                         it keeps the refresh cookie at SameSite=Lax.
#   MAIL_TRANSPORT=smtp   plus SMTP_*. Left unset, password reset and email
#                         verification links are printed to the log and reach
#                         nobody, so both features are dead.
#   STORAGE_DRIVER=s3     plus S3_*. Render's filesystem is ephemeral, so local
#                         uploads are lost on every deploy and on every restart.
#
# Optional, but without it you cannot tell whether the keep-warm ping is still
# arriving (see src/services/heartbeat.js):
#
#   KEEP_WARM_TOKEN       guards GET /api/keep-warm/status.
#
# Separately, and not a configuration matter: register a DMCA designated agent
# with the U.S. Copyright Office before operating publicly. It takes days, and
# the takedown process in legal/DMCA_POLICY.md is incomplete without it.

services:
  - type: web
    name: vorth-api
    runtime: node
    # 'free' costs nothing, and this service serves the page itself - so what a
    # free instance actually costs is a slow *first* request after an idle period,
    # while it wakes: the page is a spinner rather than a blank screen, and once
    # loaded the SPA keeps working because the access token lives in memory.
    #
    # That delay is currently prevented rather than merely tolerated: an uptime
    # monitor pings GET /api/keep-warm every 5 minutes, well inside the ~15-minute
    # spin-down. Render's own cron jobs need a paid plan, so the ping has to come
    # from outside.
    #
    # If that monitor ever lapses, raise this to 'starter' ($7/mo) to remove the
    # problem instead of depending on a third party. Nothing in the app changes.
    plan: free
    region: frankfurt

    # The repo is a monorepo; the app lives in vorth-backend/.
    rootDir: vorth-backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      # PORT is injected by Render and must be honoured. It is deliberately not
      # set here: hardcoding it was wrong, and the app defaults to 5000 only when
      # nothing supplies one.

      # Neon, hand-set. Not linked from a `databases:` block, because there isn't
      # one - see the note at the foot of this file.
      #
      # `sync: false` is what makes the value yours to supply: Render leaves the
      # existing value alone on re-apply instead of overwriting a live production
      # connection string with a blank one.
      - key: DATABASE_URL
        sync: false

      - key: DATABASE_SSL
        value: 'true'

      # A random 64-char value per environment, regenerated on redeploy only if
      # you clear it. Rotating it invalidates every access token.
      - key: JWT_SECRET
        generateValue: true
      # Short-lived access token; the httpOnly refresh cookie carries the
      # session. These only work together.
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_DAYS
        value: '30'
      - key: REFRESH_COOKIE
        value: 'true'
      - key: SECURE_COOKIES
        value: 'true'

      # Correct behind Render's proxy. If the service is ever exposed directly,
      # this becomes a spoofing hazard, since X-Forwarded-For becomes client
      # controlled and the rate limiters key on it.
      - key: TRUST_PROXY
        value: 'true'

      # Counters live in the database, so they survive restarts and are shared
      # if the service is scaled past one instance.
      - key: RATE_LIMIT_STORE
        value: postgres
      - key: RATE_LIMIT_WINDOW_MINUTES
        value: '15'
      - key: RATE_LIMIT_MAX_REQUESTS
        value: '600'
      # Deliberately tighter, and keyed on IP *and* the submitted identifier so
      # one attacker cannot lock out a whole shared NAT.
      - key: AUTH_RATE_LIMIT_MAX_REQUESTS
        value: '20'

      # 0 = boot and report problems in the log; 1 = refuse to boot on a
      # configuration error.
      #
      # This starts at 0 on purpose. A first deploy cannot yet have working mail
      # or object storage, both of which need credentials that only exist after
      # the service does, so '1' here would be an immediate crash loop on a
      # blueprint that is in fact correct.
      #
      # Set it to '1' before serving the public. At that point it is the right
      # setting: the alternative is coming up healthy with password reset that
      # reaches nobody and uploads that vanish on the next deploy.
      - key: VORTH_STRICT_CONFIG
        value: '0'

      # ---- Set these in the dashboard before going public ----
      - key: CLIENT_ORIGINS
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: DMCA_CONTACT_EMAIL
        sync: false
      - key: SUPPORT_CONTACT_EMAIL
        sync: false
      # Guards GET /api/keep-warm/status. Any random string; unset means that
      # endpoint refuses to answer rather than reporting the heartbeat's state to
      # anyone who asks. Set once the keep-warm monitor is running.
      - key: KEEP_WARM_TOKEN
        sync: false
      # DMCA counter-notice response window, in business days. 10 to 14; values
      # outside that are clamped. Defaults to 10, the earliest the statute
      # allows, so the clock only runs in the complainant's favour.
      - key: DMCA_COUNTER_NOTICE_DAYS
        value: '10'

      # Mail. Unset is treated as an error in production, which is the point:
      # the alternative is shipping password reset that cannot work.
      - key: MAIL_TRANSPORT
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_SECURE
        value: 'false'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Only turn this on once SMTP works, or nobody can ever verify.
      - key: REQUIRE_EMAIL_VERIFICATION
        value: 'false'

      # Object storage. Unset is treated as an error in production, because
      # Render's disk does not survive a redeploy.
      - key: STORAGE_DRIVER
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      # Leave S3_ENDPOINT empty for AWS S3. Set it for R2, MinIO, B2 or Ceph;
      # a custom endpoint is addressed path-style, bucket included in the path.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Set for a world-readable bucket or a CDN in front of one. Left empty,
      # uploads are served through short-lived presigned GETs.
      - key: S3_PUBLIC_BASE_URL
        sync: false

# NO CRON SERVICE IS DECLARED HERE, DELIBERATELY.
  #
  # This was one, and it was removed: Render gates cron jobs behind a paid plan, so
  # declaring one would fail the blueprint apply or start a bill. That was found
  # after it was committed, not before - the "free cron job" was assumed rather
  # than checked, which is the mistake worth recording here so nobody re-adds it.
  #
  # The problem it was solving is real. A free web service is stopped after ~15
  # minutes without traffic, and the first request after that waits for it to wake.
  # The fix has to come from outside Render, for free:
  #
  #   - Any free uptime monitor pointed at https://vorth.onrender.com/api/keep-warm
  #     on a 5-minute interval. That both keeps the instance awake and emails you
  #     when it stops responding, which a Render cron job never would have done.
  #     GET /api/keep-warm is unauthenticated precisely so a monitor can call it.
  #   - GET /api/keep-warm/status additionally reports whether such a ping has ever
  #     stopped arriving. See src/services/heartbeat.js.
  #
  # Both are free. Neither is declared here because both need an account on a
  # third-party service, which is the operator's to create.

# NO `databases:` BLOCK, DELIBERATELY.
  #
  # One used to be here, provisioning a Render-managed Postgres named `vorth-db`
  # on the $7/month basic-256mb plan. It was removed because it never existed in
  # practice: production runs on Neon, and `DATABASE_URL` above is a hand-set
  # string (`sync: false`), not a link. Applying this blueprint would have created
  # a second, empty, $7/month database that nothing connects to.
  #
  # Keeping the declaration would have been worse than useless: it is the kind of
  # drift where the file says one thing and the running service does another, and
  # nobody notices until a bill arrives.
  #
  # To use a Render-managed database instead, re-add the block AND change
  # DATABASE_URL above from `sync: false` to a `fromDatabase` link. Doing one
  # without the other is what caused the original confusion.